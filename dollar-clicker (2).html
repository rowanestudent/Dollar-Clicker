<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Dollar Clicker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
body{margin:0;background:#1d2b1f;color:#e8f5e0;font:10px/1.6 'Press Start 2P',monospace;display:flex;flex-wrap:wrap;min-height:100vh}
canvas{image-rendering:pixelated}
#l{flex:1 1 280px;display:flex;flex-direction:column;align-items:center;padding:16px;background:#2c4a30;border-right:4px solid #111}
h1{font-size:16px;color:#f5e663;text-shadow:2px 2px #111;margin:4px 0 12px;text-align:center}
#m{font-size:18px;text-shadow:2px 2px #111}
#d{font-size:9px;color:#9be3a8;margin:6px 0 20px}
#b{width:min(220px,70vw);height:min(220px,70vw);background:#3a9d4f;border:4px solid #111;box-shadow:inset -6px -6px #2a7a3a,inset 6px 6px #6fd081;cursor:pointer;padding:16px;image-rendering:pixelated}
#b:active{transform:scale(.95)}
#b canvas{width:100%;height:100%}
#r{flex:1 1 300px;padding:12px;max-height:100vh;overflow-y:auto}
.s{display:flex;align-items:center;gap:10px;background:#3b3b4f;border:3px solid #111;box-shadow:inset -3px -3px #26263a,inset 3px 3px #55556f;padding:8px;margin-bottom:8px;cursor:pointer;user-select:none}
.s.no{opacity:.45;cursor:not-allowed}
.s canvas{width:40px;height:40px;background:#222;border:2px solid #111;flex:none}
.s div{flex:1}.s b{display:block;font-size:11px;color:#f5e663}
.s i{font-style:normal;color:#9be3a8;font-size:9px}
.s em{font-style:normal;font-size:16px;color:#aaa}
.f{position:fixed;pointer-events:none;color:#f5e663;text-shadow:2px 2px #111;font-size:12px;animation:u var(--pd,1.8s) forwards}
@keyframes u{60%{opacity:1}to{transform:translate(var(--dx,0),-80px) scale(1.2);opacity:0}}
#l{position:relative;overflow:hidden}
#b canvas{animation:bob 1.2s steps(3) infinite alternate}
@keyframes bob{to{transform:translateY(-6px)}}
#b.q{animation:q .18s}
@keyframes q{40%{transform:scale(.86,.9)}70%{transform:scale(1.07)}}
.s:not(.no){outline:3px solid #f5e66300;outline-offset:-3px;animation:g 1s infinite alternate}
@keyframes g{to{outline-color:#f5e663}}
.s.bn{animation:bn .2s}
@keyframes bn{50%{transform:translateX(8px) scale(1.03)}}
.pp{display:inline-block;animation:pp .25s}
@keyframes pp{50%{transform:scale(1.8);color:#f5e663}}
body.sh{animation:sh .3s}
@keyframes sh{25%{transform:translate(-4px,3px)}50%{transform:translate(4px,-3px)}75%{transform:translate(-3px,-2px)}}
.p{position:fixed;width:6px;height:6px;pointer-events:none;z-index:9;animation:pt .7s ease-out forwards}
@keyframes pt{60%{transform:translate(var(--x),var(--y))}to{transform:translate(var(--x),calc(var(--y) + 40px));opacity:0}}
.bl{position:absolute;top:-12px;width:16px;height:8px;background:#3a9d4f;border:2px solid #9be3a8;opacity:.5;pointer-events:none;animation:fl 3s linear forwards}
@keyframes fl{to{transform:translateY(110vh) rotate(180deg)}}
.s{transition:transform .08s,filter .08s}
.s:not(.no):hover{transform:translateX(-6px);filter:brightness(1.2);background:#4a4a66}
.s.no:hover{filter:brightness(1.1)}
.s:hover canvas{animation:wig .4s steps(2) infinite}
@keyframes wig{50%{transform:translateY(-3px) rotate(-6deg)}}
#b:hover{filter:brightness(1.15);transform:scale(1.04)}
#tip{position:fixed;width:240px;background:#1a1a28;border:3px solid #f5e663;box-shadow:4px 4px #111;padding:10px;z-index:20;pointer-events:none;display:none;font-size:9px;line-height:1.7}
#tip h3{margin:0 0 6px;font-size:11px;color:#f5e663;display:flex;align-items:center;gap:8px}
#tip img{width:32px;height:32px;image-rendering:pixelated;background:#222;border:2px solid #111}
#tip hr{border:0;border-top:2px dashed #555;margin:6px 0}
#tip .fl{color:#9a9ab5;font-style:italic}
#tip .bad{color:#f66}#tip .ok{color:#9be3a8}
#up{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;margin-bottom:10px;padding:8px;background:#222;border:3px solid #111}
#up:empty::before{content:'Upgrades appear here';color:#666;font-size:8px}
.u{width:40px;height:40px;border:3px solid;background:#333;cursor:pointer;padding:3px;box-shadow:inset -2px -2px #111;transition:transform .08s}
.u:hover{transform:scale(1.15) rotate(-4deg);filter:brightness(1.3)}.u.no{opacity:.4}.u canvas{width:100%;height:100%}
.nu{animation:nu .5s}@keyframes nu{0%{transform:scale(0) rotate(180deg)}70%{transform:scale(1.4)}}
#b{position:relative;overflow:hidden}
#b::after{content:'';position:absolute;top:-20%;left:-60%;width:30%;height:140%;background:rgba(255,255,255,.45);transform:skewX(-20deg);pointer-events:none}
#b:hover::after{animation:sw .7s steps(7) infinite}@keyframes sw{to{left:130%}}
#b:hover canvas{animation:flip 1s steps(8) infinite}
@keyframes flip{25%{transform:scaleX(.1)}50%{transform:scaleX(-1)}75%{transform:scaleX(.1)}}
#b:hover{box-shadow:inset -6px -6px #2a7a3a,inset 6px 6px #6fd081,0 0 24px #f5e663}
.sp{position:fixed;width:6px;height:6px;pointer-events:none;z-index:9;animation:tw .5s forwards}
@keyframes tw{0%{transform:scale(0)}50%{transform:scale(1.6) rotate(45deg)}to{transform:scale(0) rotate(90deg)}}
#mn{margin-top:auto;padding-top:16px;width:100%;text-align:center}
#mn button{font:inherit;font-size:9px;color:#fff;background:#3b3b4f;border:3px solid #111;box-shadow:inset -2px -2px #26263a,inset 2px 2px #55556f;padding:6px;margin:2px;cursor:pointer}
#mn button:hover{background:#4a4a66}#mn button:active{transform:translateY(2px)}
#io{display:none;width:100%;height:50px;font:8px monospace;margin-bottom:6px;background:#111;color:#9be3a8;border:2px solid #555}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1a1a28;border:3px solid #f5e663;padding:8px 12px;z-index:30;opacity:0;pointer-events:none;transition:opacity .3s;text-align:center}#toast.on{opacity:1}
#b{width:min(240px,55vw);height:auto;aspect-ratio:2/1;background:none;border:0;box-shadow:none;padding:0}
#b:hover{box-shadow:0 0 28px #f5e663}
#bw{position:relative;padding:34px 36px}#cr{position:absolute;inset:0;pointer-events:none}
.cu{position:absolute;left:0;top:0;width:18px;height:18px;image-rendering:pixelated}
#v{flex:1 1 220px;padding:12px;background:#243a28;border-right:4px solid #111;max-height:100vh;overflow-y:auto}
.st{position:relative;height:54px;margin-bottom:8px;border:3px solid #111;background:repeating-linear-gradient(90deg,#33503a 0 8px,#2e4833 8px 16px);overflow:hidden}
.st span{position:absolute;right:6px;top:3px;font-size:8px;color:#f5e663;text-shadow:1px 1px #111;z-index:2}
.bi{position:absolute;bottom:3px;width:32px;height:32px;image-rendering:pixelated;animation:idle .8s steps(2) infinite}
@keyframes idle{50%{transform:translateY(-3px)}}
.dr{animation:drp .4s}@keyframes drp{0%{transform:translateY(-60px) scale(1.6);opacity:0}70%{transform:translateY(4px)}}
.s.lk canvas{filter:brightness(0)}.s.lk{cursor:default}
.bl{background:var(--bill) center/100% 100%;border:0;width:24px;height:12px;image-rendering:pixelated;opacity:.6}
.fb{position:fixed;width:24px;height:12px;background:var(--bill) center/100% 100%;image-rendering:pixelated;pointer-events:none;z-index:9;animation:fb .9s ease-in forwards}
@keyframes fb{30%{transform:translate(calc(var(--x)*.5),-70px) rotate(calc(var(--r)*.5))}to{transform:translate(var(--x),120px) rotate(var(--r));opacity:0}}
.cp{animation:cp .12s}@keyframes cp{50%{transform:scale(1.15)}}
body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#io{-webkit-user-select:text;user-select:text}
img,canvas{-webkit-user-drag:none;user-drag:none}
#fn{cursor:text;padding:4px 8px;border:2px dashed transparent;margin-bottom:10px;text-align:center;color:#9be3a8;font-size:9px;max-width:100%;word-break:break-word}
#fn:hover{border-color:#f5e663;color:#f5e663}
#fn input{font:inherit;width:230px;max-width:100%;background:#111;color:#f5e663;border:2px solid #f5e663;padding:4px;text-align:center;-webkit-user-select:text;user-select:text}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes bgm{50%{background-position:100% 50%}}@keyframes pls{to{transform:scale(1.06)}}
#bw::before{content:'';position:absolute;inset:-30px;background:repeating-conic-gradient(rgba(245,230,99,.2) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 20s linear infinite;opacity:0;transition:opacity 2s;pointer-events:none}
html.l1 #bw::before{opacity:1}
html.l2 #bw{animation:hue 5s linear infinite}html.l2 h1{animation:hue 3s linear infinite}
html.l3 #l{background:linear-gradient(135deg,#2c4a30,#4a2c4a,#2c3a4a,#4a4a2c);background-size:400% 400%;animation:bgm 8s ease infinite}
html.l3 .st{animation:hue 6s linear infinite}
html.l4{animation:hue 30s linear infinite}html.l4 #bw::before{animation-duration:6s}html.l4 .s:not(.no){animation:g .4s infinite alternate}
html.l5 #bw{animation:hue 2s linear infinite,pls .4s ease-in-out infinite alternate}
html.l5 body::after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.1) 0 2px,transparent 2px 4px);z-index:50}
.fr{position:fixed;top:-20px;width:24px;height:12px;background:var(--bill) center/100% 100%;image-rendering:pixelated;pointer-events:none;opacity:.55;animation:fr 3s linear forwards}
@keyframes fr{to{transform:translateY(110vh) rotate(var(--r))}}
body{padding-bottom:26px}
.gd{position:fixed;width:64px;height:32px;z-index:15;cursor:pointer;animation:gf 20s linear forwards;filter:sepia(1) saturate(5) brightness(1.3) drop-shadow(0 0 10px #ff0)}
.gd canvas{width:100%;height:100%;animation:gb .8s ease-in-out infinite alternate}
@keyframes gf{0%{opacity:0;transform:scale(0)}5%{opacity:1;transform:scale(1)}90%{opacity:1}to{opacity:0}}@keyframes gb{to{transform:translateY(-8px) rotate(8deg)}}
#bf{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:25;pointer-events:none}
#bf div{background:#1a1a28;border:3px solid #f5e663;color:#f5e663;padding:4px 8px;margin-bottom:4px;font-size:9px;text-align:center}
#nw{position:fixed;left:0;right:0;bottom:0;height:22px;background:#111;border-top:3px solid #f5e663;z-index:12;overflow:hidden;pointer-events:none;font-size:9px;line-height:20px;color:#f5e663;white-space:nowrap}
#nw span{display:inline-block}@keyframes nw{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
#qb{display:flex;gap:4px;margin-bottom:8px}
#qb button,#xx,#asc{font:inherit;font-size:9px;color:#fff;background:#3b3b4f;border:3px solid #111;padding:6px 8px;cursor:pointer}
#qb .on{background:#f5e663;color:#111}#asc{display:block;width:100%;margin:10px 0;background:#6a3a8a}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:40;display:none;align-items:center;justify-content:center}
#ovb{background:#243a28;border:4px solid #f5e663;width:min(560px,94vw);max-height:90vh;overflow-y:auto;padding:14px;position:relative}
#xx{position:absolute;right:8px;top:8px}#ovb h3{font-size:10px;color:#f5e663;margin:8px 0}
#sts>div{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed #456;font-size:9px}
#ag{display:flex;flex-wrap:wrap;gap:4px}.at{width:30px;height:30px;background:#222;border:2px solid #111;padding:2px}.at.lo{opacity:.4;filter:brightness(0)}
body.wh::before{content:'';position:fixed;inset:0;background:#fff;z-index:99;pointer-events:none;animation:wh 1.5s forwards}@keyframes wh{to{opacity:0}}

/* ===== UI REFRESH ===== */
:root{--ink:#12101c;--p1:#1d1a2e;--p2:#2a2640;--edge:#0a0814;--hi:#4a4470;--gold:#ffd84a;--grn:#58d36f;--red:#ff6b6b;--txt:#efe9ff;--mut:#8e86b5}
html{scrollbar-color:var(--hi) var(--edge)}
*::-webkit-scrollbar{width:12px}*::-webkit-scrollbar-track{background:var(--edge)}*::-webkit-scrollbar-thumb{background:var(--hi);border:3px solid var(--edge)}
body{display:grid;grid-template-columns:minmax(300px,1fr) minmax(200px,.7fr) minmax(330px,1.05fr);gap:14px;height:100vh;padding:14px 14px 38px;color:var(--txt);font-size:10px;line-height:1.7;
background-color:var(--ink);background-image:linear-gradient(45deg,#181530 25%,transparent 25%,transparent 75%,#181530 75%),linear-gradient(45deg,#181530 25%,transparent 25%,transparent 75%,#181530 75%);background-size:16px 16px;background-position:0 0,8px 8px}
#l,#v,#r{min-height:0;border:4px solid var(--edge);background:var(--p1);box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),inset 4px 4px 0 rgba(255,255,255,.07),6px 6px 0 rgba(0,0,0,.5)}
#l{padding:18px 16px;background:radial-gradient(circle at 50% 36%,#34406a 0,var(--p1) 62%)}
#v,#r{padding:14px;max-height:none;overflow-y:auto}
h2{margin:0 0 10px;padding-bottom:6px;font-size:10px;letter-spacing:2px;color:var(--gold);border-bottom:3px dashed var(--hi)}
h2::before{content:'\25A0  ';color:var(--grn)}#r h2:not(:first-child){margin-top:16px}
h1{font-size:21px;letter-spacing:2px;line-height:1.3;color:var(--gold);margin:2px 0 10px;text-shadow:0 3px 0 #c98a00,0 6px 0 #7a4a00,0 9px 0 #000}
#fn{background:var(--edge);border:3px solid var(--hi);color:var(--grn);margin:6px 0 14px}
#m{font-size:24px;color:#7dff8f;background:var(--edge);border:4px solid var(--hi);padding:10px 18px;min-width:220px;text-align:center;text-shadow:0 0 12px rgba(125,255,143,.6),3px 3px #000}
#d{color:var(--mut);margin:8px 0 6px;font-size:9px}
#up{background:var(--edge);border:4px solid var(--hi);box-shadow:inset 3px 3px 0 rgba(0,0,0,.5)}
.u{background:var(--p2);box-shadow:inset -3px -3px rgba(0,0,0,.45),inset 3px 3px rgba(255,255,255,.16)}
.s{background:var(--p2);border:4px solid var(--edge);padding:8px 10px;gap:12px;box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.1);
clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))}
.s:not(.no):hover{background:#3a3560;transform:translateX(-6px);filter:brightness(1.15)}
.s canvas{width:46px;height:46px;background:var(--edge);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--hi)}
.s b{font-size:11px;color:var(--gold);margin-bottom:2px}
.s i{font-size:9px;color:var(--red)}.s:not(.no) i{color:var(--grn)}
.s em{font-size:22px;color:#6a62a0;text-shadow:2px 2px #000}
.s.no{opacity:.8}.s.no canvas{filter:grayscale(.5)}.s.lk{opacity:.6}.s.lk canvas{filter:brightness(0)}
.st{background:repeating-linear-gradient(90deg,#2e2a4a 0 8px,#292542 8px 16px);border:4px solid var(--edge);box-shadow:inset 0 -8px 0 #1a1730,inset 0 3px 0 rgba(255,255,255,.06)}
.st span{background:var(--edge);padding:1px 6px;color:var(--gold)}
#qb button,#mn button,#xx,#asc{background:var(--p2);color:var(--txt);border:4px solid var(--edge);box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),inset 3px 3px 0 rgba(255,255,255,.12)}
#qb button:hover,#mn button:hover{background:var(--hi)}#qb button:active,#mn button:active{transform:translateY(2px)}
#qb .on{background:var(--gold);color:var(--edge)}#qb button{flex:1}
#asc{background:#6a3a8a}
#tip{background:var(--edge);border:4px solid var(--gold);box-shadow:6px 6px 0 #000;color:var(--txt)}
#toast{background:var(--edge);border:4px solid var(--gold);box-shadow:5px 5px 0 #000;color:var(--gold)}
#nw{background:var(--edge);border-top:4px solid var(--hi);color:var(--grn)}
#ovb{background:var(--p1);border:4px solid var(--gold);box-shadow:8px 8px 0 #000}
#io{background:var(--edge);border:3px solid var(--hi)}
@media (max-width:900px){body{display:flex;flex-direction:column;height:auto;min-height:100vh}#l{min-height:480px}#v,#r{overflow:visible}}

/* ===== LEVEL AURA ===== */
#bw::before,html.l5 body::after,.fr{display:none}
html.l2 #bw,html.l5 #bw,html.l2 h1,html.l3 .st,html.l4,html.l4 #bw{animation:none}
html.l3 #l{animation:none;background:radial-gradient(circle at 50% 36%,#4a3a7a 0,var(--p1) 62%)}
html.l4 #l{background:radial-gradient(circle at 50% 36%,#6a3a7a 0,var(--p1) 62%)}
html.l5 #l{background:radial-gradient(circle at 50% 36%,#8a6a2a 0,#3a2a4a 45%,var(--p1) 75%)}
html.l5 #b{filter:sepia(.55) saturate(2.2) brightness(1.1)}
#au{position:absolute;inset:0;pointer-events:none}
#au>div{position:absolute;opacity:0;transition:opacity 1.5s}
.gl{inset:-28px;background:radial-gradient(ellipse closest-side,rgba(255,216,74,.5),transparent 100%)}
.ry,.ry2{inset:-70px;-webkit-mask-image:radial-gradient(ellipse closest-side,#000 20%,transparent 100%);mask-image:radial-gradient(ellipse closest-side,#000 20%,transparent 100%)}
.ry{background:repeating-conic-gradient(rgba(255,216,74,.45) 0 6deg,transparent 6deg 20deg);animation:spin 30s steps(60) infinite}
.ry2{background:repeating-conic-gradient(rgba(255,139,214,.4) 0 4deg,transparent 4deg 12deg,rgba(107,214,255,.4) 12deg 16deg,transparent 16deg 30deg);animation:spin 45s steps(60) infinite reverse}
.pr{left:36px;right:36px;top:34px;bottom:34px;border:4px solid rgba(255,216,74,.85)}
html.l1 .gl,html.l1 .ry{opacity:1}html.l2 .ry2{opacity:.9}
html.l3 .gl{opacity:1;background:conic-gradient(rgba(255,216,74,.55),rgba(255,107,214,.55),rgba(107,214,255,.55),rgba(88,211,111,.55),rgba(255,216,74,.55));-webkit-mask-image:radial-gradient(ellipse closest-side,#000 25%,transparent 100%);mask-image:radial-gradient(ellipse closest-side,#000 25%,transparent 100%);animation:spin 12s steps(48) infinite}
html.l4 .pr{animation:ping 2.4s steps(8) infinite}html.l4 .pr.p2{animation-delay:1.2s}
@keyframes ping{0%{transform:scale(1);opacity:.9}to{transform:scale(1.6,2);opacity:0}}
.sk,.cw,.cn{display:none}.sk,.cw{position:absolute;inset:0}
html.l2 .sk,html.l3 .cw,html.l5 .cn{display:block}
.sk i{position:absolute;width:6px;height:6px;opacity:0;animation:tw2 1.6s steps(4) infinite}
@keyframes tw2{0%{transform:scale(0);opacity:1}50%{transform:scale(1.8) rotate(45deg);opacity:1}to{transform:scale(0);opacity:1}}
.cw b{position:absolute;bottom:22%;width:8px;height:8px;background:#ffd84a;border:2px solid #7a4a00;opacity:0;animation:rise 3s linear infinite}
@keyframes rise{20%{opacity:1}to{transform:translateY(-150px);opacity:0}}
.cn{position:absolute;left:50%;top:0;width:56px;height:56px;margin-left:-28px;z-index:3;animation:cb 1.2s steps(3) infinite alternate}
@keyframes cb{to{transform:translateY(-5px)}}
.lu{position:absolute;left:50%;top:-6px;z-index:6;white-space:nowrap;font-size:16px;color:var(--gold);text-shadow:0 3px 0 #c98a00,0 6px 0 #000;pointer-events:none;animation:lu 2.2s steps(14) forwards}
@keyframes lu{0%{transform:translate(-50%,24px) scale(.2);opacity:0}12%{transform:translate(-50%,0) scale(1.4);opacity:1}22%{transform:translate(-50%,0) scale(1)}80%{opacity:1}to{transform:translate(-50%,-34px);opacity:0}}

/* ===== DOPAMINE ===== */
.f.crit{font-size:20px;color:#ff8bd6;text-shadow:0 0 8px #ff0,3px 3px #000;animation-duration:calc(var(--pd,1.8s)*1.4);z-index:12}
.rp{position:fixed;width:10px;height:10px;margin:-5px;border:3px solid #ffd84a;pointer-events:none;z-index:8;animation:rp .45s steps(5) forwards}
@keyframes rp{to{transform:scale(7);opacity:0}}
#cmb{position:absolute;left:0;right:0;bottom:2px;text-align:center;text-shadow:2px 2px #000;pointer-events:none;z-index:4;display:none;white-space:nowrap}
.gd.sm{width:40px;height:20px}
#l{isolation:isolate}
